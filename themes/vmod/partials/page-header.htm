<div class="page-header d-print-none mb-4">
    <div class="row g-3 align-items-center">
        <div class="col">
            {% if pretitle %}<div class="page-pretitle">{{ pretitle }}</div>{% endif %}
            <h1 class="page-title">{{ title }}</h1>
            {% if description %}<p class="page-subtitle text-secondary mb-0">{{ description }}</p>{% endif %}
        </div>
        {% if body|default('')|trim %}<div class="col-12 col-md-auto ms-md-auto"><div class="btn-list">{{ body|raw }}</div></div>{% endif %}
    </div>
</div>
