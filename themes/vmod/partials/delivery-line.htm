<div class="border rounded p-3 mb-3" data-document-row><div class="row g-2">
<div class="col-md-8"><label class="form-label">Approved SO line and source<select class="form-select" name="lines[{{ index }}][sales_order_item_id]" required>{% for row in progressLines %}<option value="{{ row.item.id }}" {{ item.sales_order_item_id == row.item.id ? 'selected' }}>{{ loop.index }}. {{ row.item.snapshot.description }} · {{ row.item.snapshot.package_name }} · {{ row.item.snapshot.location_name }} · remaining {{ row.remaining }}</option>{% endfor %}</select></label></div>
<div class="col-md-4"><label class="form-label">Package quantity<input class="form-control" name="lines[{{ index }}][quantity]" value="{{ item ? item.quantity : '1' }}" inputmode="decimal" required></label></div></div>
{% for field in ['sales_order_item_id','quantity'] %}<div class="invalid-feedback d-block" data-validate-for="lines.{{ index }}.{{ field }}"></div>{% endfor %}<button type="button" class="btn btn-outline-secondary btn-sm mt-2" data-remove-row>Remove line</button></div>
