{% for doc in choices.documents %}<div class="d-flex align-items-center gap-2 border-top py-2"><span>{{ doc.number }} · {{ doc.document_date }} · {{ doc.state|replace({'_':' '}) }}</span><button type="button" class="btn btn-sm btn-outline-primary" data-invoice-add data-branch="{{ choiceScope.branch_id }}" data-party="{{ choiceScope.party_id }}" data-direction="{{ choiceScope.direction }}" data-kind="{{ doc.kind }}" data-id="{{ doc.id }}" data-revision="{{ doc.revision_id }}" data-number="{{ doc.number }}" data-date="{{ doc.document_date }}">Link {{ doc.number }}</button></div>{% else %}<p>No eligible documents found.</p>{% endfor %}
<div class="d-flex gap-2 mt-2">{% if choices.page > 1 %}<button type="button" class="btn btn-sm btn-outline-secondary" data-request="invoiceReferences::onChoices" data-request-data="page: {{ choices.page - 1 }}">Previous documents</button>{% endif %}{% if choices.has_more %}<button type="button" class="btn btn-sm btn-outline-secondary" data-request="invoiceReferences::onChoices" data-request-data="page: {{ choices.page + 1 }}">Next documents</button>{% endif %}</div>
