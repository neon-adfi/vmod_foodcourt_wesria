<div class="line-item" data-document-row>
{% if item %}<input type="hidden" name="lines[{{ index }}][item_id]" value="{{ item.id }}"><div class="line-title">{{ item.snapshot.sku }} · {{ item.snapshot.description }} · {{ item.snapshot.package_name }}</div>{% else %}
<label class="d-block"><span class="form-label required">Supplier offer</span><select class="form-select" name="lines[{{ index }}][offer_id]" data-offer-select required><option value="">Choose a package</option>{% for offer in offers %}<option value="{{ offer.id }}" data-supplier="{{ offer.supplier_id }}">{{ offer.supplier.name }} · {{ offer.package.product.name }} · {{ offer.package.name }} · {{ offer.unit_price }} before tax</option>{% endfor %}</select></label>{% endif %}
<div class="row g-2 mt-1">
    <div class="col-6 col-md-3"><label class="d-block"><span class="form-label required">Quantity</span><input class="form-control" name="lines[{{ index }}][quantity]" value="{{ item ? item.quantity : '1' }}" inputmode="decimal" required></label></div>
    <div class="col-6 col-md-3"><label class="d-block"><span class="form-label">Tax</span><select class="form-select" name="lines[{{ index }}][tax_rate_id]"><option value="">No tax</option>{% if item.snapshot.tax_rate_id %}<option value="{{ item.snapshot.tax_rate_id }}" selected>{{ item.snapshot.tax_label }} · saved {{ item.snapshot.tax_rate }}%</option>{% endif %}{% for rate in rates %}{% if rate.id != item.snapshot.tax_rate_id %}<option value="{{ rate.id }}">{{ rate.name }} · {{ rate.rate }}%</option>{% endif %}{% endfor %}</select></label></div>
    <div class="col-6 col-md-3"><label class="d-block"><span class="form-label">Price action</span><select class="form-select" name="lines[{{ index }}][price_action]"><option value="{{ item ? 'keep' : 'offer' }}">{{ item ? 'Keep saved price basis' : 'Use supplier offer' }}</option>{% if item %}<option value="offer">Use latest offer</option>{% endif %}<option value="override">Enter agreed price</option></select></label></div>
    <div class="col-6 col-md-3"><label class="d-block"><span class="form-label">Agreed unit price</span><input class="form-control" name="lines[{{ index }}][unit_price]" value="{{ item.snapshot.unit_price }}" inputmode="decimal"></label></div>
</div>
<label class="d-block mt-2"><span class="form-label">Price override reason</span><input class="form-control" name="lines[{{ index }}][price_reason]" value="{{ item.snapshot.price_reason }}" maxlength="2000"></label>
{% for field in ['item_id', 'offer_id', 'quantity', 'tax_rate_id', 'unit_price', 'price_action', 'price_reason'] %}<div class="invalid-feedback d-block" data-validate-for="lines.{{ index }}.{{ field }}"></div>{% endfor %}
<button class="btn btn-ghost-danger btn-sm mt-2" type="button" data-remove-row>Remove line</button></div>
