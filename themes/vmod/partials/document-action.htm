<form data-request="{{ actionComponent|default('purchasing') }}::{{ handler }}" data-request-validate data-request-flash data-workspace-context="{{ workspaceToken }}" method="post" class="document-action">
{% partial 'form-errors' %}<input type="hidden" name="id" value="{{ record.id }}"><input type="hidden" name="version" value="{{ record.version }}"><input type="hidden" name="operation_key" value="{{ operationKey }}">
{% if reason %}<label class="form-label required" for="reason-{{ handler }}">{{ label }} reason</label><textarea id="reason-{{ handler }}" class="form-control mb-2" name="reason" rows="2" required maxlength="2000"></textarea><div data-validate-for="reason" class="invalid-feedback d-block"></div>{% endif %}
<button type="submit" class="btn {{ reason ? 'btn-outline-danger' : 'btn-success' }} w-100">{{ label }}</button>
</form>
