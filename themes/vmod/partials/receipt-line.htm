<div class="border rounded p-3 mb-3" data-document-row><div class="row g-2">
<div class="col-md-6"><label class="form-label">PO line<select class="form-select" name="lines[{{ index }}][purchase_order_item_id]" required>{% for row in progressLines %}<option value="{{ row.item.id }}" {{ item.purchase_order_item_id == row.item.id ? 'selected' }}>{{ row.item.snapshot.description }} · {{ row.item.snapshot.package_name }} · remaining {{ row.remaining }}</option>{% endfor %}</select></label></div>
<div class="col-md-3"><label class="form-label">Receiving location<select class="form-select" name="lines[{{ index }}][location_id]" required><option value="">Choose location</option>{% for location in locations %}<option value="{{ location.id }}" {{ item.location_id == location.id ? 'selected' }}>{{ location.name }}</option>{% endfor %}</select></label></div>
<div class="col-md-3"><label class="form-label">Package quantity<input class="form-control" name="lines[{{ index }}][quantity]" value="{{ item ? item.quantity : '1' }}" inputmode="decimal" required></label></div></div>
{% for field in ['purchase_order_item_id','location_id','quantity'] %}<div class="invalid-feedback d-block" data-validate-for="lines.{{ index }}.{{ field }}"></div>{% endfor %}<button type="button" class="btn btn-outline-secondary btn-sm mt-2" data-remove-row>Remove line</button></div>
